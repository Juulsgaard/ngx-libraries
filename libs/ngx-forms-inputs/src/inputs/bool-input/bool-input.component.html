@if (!control.hidden()) {

    <mat-slide-toggle [color]="color()" [labelPosition]="labelPosition()"
                      [class.read-only]="control.readonly() || control.disabled()"
                      [(ngModel)]="model" #input>

        {{ control.label() }}

        @if (control.tooltip(); as t) {
            <ngx-icon class="tooltip" alias="help" [matTooltip]="t" matTooltipTouchGestures="off"/>
        }

    </mat-slide-toggle>

}
