@if (!control.hidden()) {
    <mat-form-field [appearance]="appearance()" [color]="color()" subscriptSizing="dynamic">

        @if (control.label(); as l) {
            <mat-label>
                {{l}}

                @if (control.tooltip(); as t) {
                    <ngx-icon class="tooltip" alias="help" [matTooltip]="t"
                              matTooltipPosition="above" matTooltipTouchGestures="off"/>
                }

            </mat-label>
        }


        <div class="color" matIconPrefix ngx-colors-trigger
             [lockValues]="{alpha: withAlpha() ? undefined : 1}"
             animation="popup" [display]="{text: false}" outputModel="HEXA"
             [(ngModel)]="model" [disabled]="control.readonly() || control.disabled()"
             [palette]="palette()" noClickBubble>

            <div class="fill" [style.background-color]="control.value()"></div>

        </div>

        <input ngxInput type="text" [placeholder]="control.placeholder()" [required]="control.required()"
               [(ngxModel)]="model" (touched)="control.touch()"
               [autocomplete]="control.autocomplete()" [readonly]="control.readonly()" #input
               [showError]="control.showError()" [attr.dir]="direction()">

        <div matIconSuffix class="fix">
            <ng-content/>
        </div>

    </mat-form-field>

    <ngx-form-input-errors [control]="control"/>
}
