@if (!control.hidden()) {
    <mat-form-field [color]="color()" [appearance]="appearance()" subscriptSizing="dynamic">

        @if (label(); as l) {
            <mat-label>
                {{ l }}
                @if (tooltip(); as t) {
                    <ngx-icon class="tooltip" alias="help" [matTooltip]="t"
                              matTooltipPosition="above" matTooltipTouchGestures="off"/>
                }
            </mat-label>
        }

        <ngx-icon-button matIconPrefix alias="date" noClickBubble (click)="openDatePicker()"/>

        <input type="text" ngxInput [placeholder]="control.placeholder()" [required]="control.required()"
               [readonly]="control.readonly()" [(ngxModel)]="textValue" [autocomplete]="control.autocomplete()"
               [showError]="control.showError()" #input [disabled]="control.disabled()"
               [attr.dir]="direction()" (touched)="control.touch()">

        <div matIconSuffix class="fix">
            <ng-content></ng-content>
        </div>

    </mat-form-field>

    <ngx-form-input-errors [control]="control"/>
}
