@if (!control.hidden()) {
    <mat-form-field [appearance]="appearance()" [color]="color()" subscriptSizing="dynamic">

        @if (control.label(); as l) {
            <mat-label>
                {{ l }}
                @if (control.tooltip(); as t) {
                    <ngx-icon class="tooltip" alias="help" [matTooltip]="t"
                              matTooltipPosition="above" matTooltipTouchGestures="off"/>
                }
            </mat-label>
        }

        <ngx-icon-button matIconPrefix alias="date" noClickBubble (click)="openDatePicker()"/>

        <input type="text" ngxInput [placeholder]="control.placeholder()" [required]="control.required()"
               [readonly]="control.readonly()" [(ngxModel)]="textValue" (touched)="control.touch()"
               [autocomplete]="control.autocomplete()" [showError]="control.showError()"
               #input [disabled]="control.disabled()" [attr.dir]="direction()">

    </mat-form-field>

    <ngx-form-input-errors [control]="control"/>

    <ngx-mat-timepicker [format]="timeFormat" (timeSet)="pickTime($event)"/>
}
