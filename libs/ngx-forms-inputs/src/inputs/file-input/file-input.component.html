@if (!control.hidden()) {

    <div class="drop" [class.empty]="!model()" #input
         (fileDrop)="dropFile($event)" [fileDropDisable]="control.readonly()">

        @if (control.label(); as l) {
            <p class="name">
                {{ l }}
                @if (control.tooltip(); as t) {
                    <ngx-icon class="tooltip" alias="help" [matTooltip]="t"
                              matTooltipPosition="above" matTooltipTouchGestures="off"/>
                }
            </p>
        }

        <ngx-icon [alias]="control.readonly() ? 'download' : 'upload'" [size]="40"/>

        @if (!control.readonly()) {
            <ngx-button (click)="fileInput.click(); control.touch()">Browse Files</ngx-button>
        }

        @if (model(); as val) {
            <p class="file-name">{{val.name}}</p>
            <p class="file-size">{{val.size | fileSize}}</p>
        }
    </div>

    @if (!control.readonly()) {
        <div class="actions">
            <ngx-bordered-button color="warn" (click)="model.set(undefined)" [disabled]="!model()">Clear</ngx-bordered-button>
        </div>
    }

    <ngx-form-input-errors [control]="control"/>

    <input type="file" (change)="selectFile($event)" #fileInput [accept]="accept()">
}
