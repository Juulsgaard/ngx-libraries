@if (!control.hidden()) {
    <mat-form-field [appearance]="appearance()" [color]="color()" subscriptSizing="dynamic">

        @if (control.label(); as l) {
            <mat-label>
                {{ l }}
                @if (control.tooltip(); as t) {
                    <ngx-icon class="tooltip" alias="help" [matTooltip]="t"
                              matTooltipPosition="above" matTooltipTouchGestures="off"/>
                }
            </mat-label>
        }

        <textarea type="text" ngxInput [placeholder]="control.placeholder() ?? ''"
                  [required]="control.required()" [readonly]="control.readonly()"
                  [(ngxModel)]="model" [showError]="control.showError()" (touched)="control.touch()"
                  #input cdkTextareaAutosize [attr.dir]="direction()"></textarea>

        <div matIconSuffix class="fix">
            <ng-content></ng-content>
        </div>

    </mat-form-field>

    <ngx-form-input-errors [control]="control"/>
}
