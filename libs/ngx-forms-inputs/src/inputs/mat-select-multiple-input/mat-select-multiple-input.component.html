@if (!control.hidden()) {
    <mat-form-field [appearance]="appearance()" [color]="color()" subscriptSizing="dynamic">

        @if (control.label(); as l) {
            <mat-label>
                {{l}}
                @if (control.tooltip(); as t) {
                    <ngx-icon class="tooltip" alias="help" [matTooltip]="t"
                              matTooltipPosition="above" matTooltipTouchGestures="off"/>
                }
            </mat-label>
        }

        <mat-select [errorStateMatcher]="control.errorMatcher()" (openedChange)="onOpenStatus($event)"
                    [(ngModel)]="model" [ngModelOptions]="{standalone: true}" #input
                    [multiple]="true" [placeholder]="control.placeholder() ?? ''"
                    [required]="control.required()" [disabled]="control.readonly()">

            @if (control.clearable()) {
                <ngx-button class="mat-mdc-option clear" [disabled]="model().length <= 0" (click)="clear()">Clear</ngx-button>
            }

            @for (item of control.options(); track item.value) {
                <mat-option [value]="item.value">
                    {{item.label}}
                </mat-option>
            }

        </mat-select>

    </mat-form-field>

    <ngx-form-input-errors [control]="control"/>
}
