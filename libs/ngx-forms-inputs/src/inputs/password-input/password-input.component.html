@if (!control.hidden()) {
    <mat-form-field [appearance]="appearance()" [color]="color()" subscriptSizing="dynamic">

        @if (control.label(); as l) {
            <mat-label>
                {{l}}
                @if (control.tooltip(); as t) {
                    <ngx-icon class="tooltip" alias="help" [matTooltip]="t"
                              matTooltipPosition="above" matTooltipTouchGestures="off"/>
                }
            </mat-label>
        }

        <input ngxInput [type]="showPassword() ? 'text' : 'password'" [placeholder]="control.placeholder()"
               [(ngxModel)]="model" (touched)="control.touch()" [required]="control.required()"
               [autocomplete]="control.autocomplete()" [readonly]="control.readonly()"
               #input [showError]="control.showError()" [attr.dir]="direction()">

        <ngx-icon-button [alias]="showPassword() ? 'visible' : 'hidden'" matIconSuffix (click)="toggleShow()"
                         noClickBubble (mousedown)="$event.preventDefault()"/>

    </mat-form-field>

    <ngx-form-input-errors [control]="control"/>
}
