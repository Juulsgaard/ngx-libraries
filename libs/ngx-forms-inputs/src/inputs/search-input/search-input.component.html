@if (!control.hidden()) {
    <mat-form-field [appearance]="appearance()" [color]="color()" subscriptSizing="dynamic">

        <ngx-icon matIconPrefix class="search" alias="search"/>

        <input type="search" ngxInput [placeholder]="control.placeholder()" [readonly]="control.readonly()"
               [(ngxModel)]="model" (touched)="control.touch()" #input
               [attr.dir]="direction()" [showError]="control.showError()">

        <ngx-icon-button alias="close" matIconSuffix (click)="clear()" [disabled]="!model().length"
                         noClickBubble (mousedown)="$event.preventDefault()"/>

    </mat-form-field>
}
