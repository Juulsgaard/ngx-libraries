
<ngx-form-header [form]="form" heading="Form"/>

<ngx-form-wrapper *ngxForm="form as root">

    <ngx-form-card>

        <p ngxFormCardTitle>Form Section</p>
        <p ngxFormCardDescription>Section description</p>

        <form-bool-input [input]="root.bool"/>
        <form-text-input [input]="root.str"/>
    </ngx-form-card>

    <ngx-form-card *ngxFormLayer="root.layer as layer">

        <p ngxFormCardTitle>Date & Time</p>

        <form-date-input [input]="layer.date"/>
        <form-time-input [input]="layer.time"/>
    </ngx-form-card>

    <ngx-form-card>

        <p ngxFormCardTitle>Misc</p>

        <form-date-time-input [input]="root.dateTime"/>
        <form-number-input [input]="root.number"/>
    </ngx-form-card>

    <ngx-form-submit [form]="form" disableShortcut/>

</ngx-form-wrapper>
